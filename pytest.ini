[pytest]
# Anchor the rootdir here so pytest stops its upward config search at the repo
# root. Without this, pytest walks up to / and stat()s candidate config files in
# every ancestor — which hangs on this host because lookups of nonexistent
# entries directly under /home block on an unresponsive automount.
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
